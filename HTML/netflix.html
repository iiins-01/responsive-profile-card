  <style>
  /* Top navigation bar */

  
    .navbar {
      height: 60px;
      width: 1000px;
      display: flex;
      /* to align in a row */
      align-items: center;
      padding: 15px 30px;
      background-color: #000;
    }
    .net{
        font: 500;

    }

    controls how extra space is distributed between and around items. */
    justify-content: center;
    list-style: none;
    gap: 40px;
    /* this is the gap between contents of the navbar */
    color: antiquewhite;
    margin-left:100px;
   }
   .movies{
    height: 300px;
    width: 200px;
   }
   .ss{
   color: aliceblue;
   }

    background-repeat: no-repeat;
    background-size: cover;
    background-position:center ;
    opacity: 0.8;
    height: 630px;
    width: 1200px;
   }

  </style>
</head>

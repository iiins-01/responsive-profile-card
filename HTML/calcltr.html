<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: sans-serif;
        }
        body{
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(45deg, #0a0a0a, #3a4452);
        }
        #kaal{
            border: 1px solid #717377;
            padding: 20px;
            border-radius: 16px;
            background: transparent;
            box-shadow: 0px 3px 15px rgba(113,115,119,0.5);
        }

        .input{
            width: 320px;
            border: none;
            outline: none;
            padding: 24px;
            margin: 10px;
            background: transparent;
            color: white;
            font-size: 40px;
            text-align: right;
        }

        .input::placeholder{
            color: white;
        }

        button{
            border: none;
            width: 60px;
            height: 60px;
            margin: 10px;
            border-radius: 50%;
            background: transparent;
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: -3px -3px 10px rgba(255,255,255,0.1);
            transition: 0.2s;
        }

        button:hover{
            background-color: rgba(255,255,255,0.1);
        }

        .operator{
            color: greenyellow;
        }

        .equal{
            background-color: orange;
            color: white;
        }

        .equal:hover{
            background-color: darkorange;
        }

    </style>

</head>

<body>

    <div id="kaal">

        <input type="text" class="input" placeholder="0" id="display">

        <div>
            <button class="operator">AC</button>
            <button class="operator">DEL</button>
            <button class="operator">%</button>
            <button class="operator">/</button>
        </div>

        <div>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
        </div>

        <div>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>
        </div>

        <div>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
        </div>

        <div>
            <button>00</button>
            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>
        </div>

    </div>
    <script src="calcltr.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Shorts Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 0;
    }

    .shorts-section {
      padding: 20px;
    }

    .shorts-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .shorts-container {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .short-card {
      flex: 0 0 180px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
      cursor: pointer;
    }

    .short-card video {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 8px 8px 0 0;
    }

    .short-card p {
      margin: 8px;
      font-size: 14px;
      color: #333;
    }

    /* Hide scrollbar for a cleaner look */
    .shorts-container::-webkit-scrollbar {
      display: none;
    }
    .shorts-container {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div class="shorts-section">
    <div class="shorts-title">Shorts</div>
    <div class="shorts-container">
      <div class="short-card">
        <video src="short1.mp4" controls muted></video>
        <p>Funny Clip</p>
      </div>
      <div class="short-card">
        <video src="short2.mp4" controls muted></video>
        <p>Travel Vlog</p>
      </div>
      <div class="short-card">
        <video src="short3.mp4" controls muted></video>
        <p>Cooking Idea</p>
      </div>
      <div class="short-card">
        <video src="short4.mp4" controls muted></video>
        <p>Dance Trend</p>
